customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://*.execute-api.ap-south-1.amazonaws.com https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://api.open-meteo.com https://api.data.gov.in; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: 'X-Frame-Options'
        value: "DENY"
      - key: 'X-Content-Type-Options'
        value: "nosniff"
      - key: 'Referrer-Policy'
        value: "strict-origin-when-cross-origin"
      - key: 'Permissions-Policy'
        value: "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), interest-cohort=()"
      - key: 'Cross-Origin-Opener-Policy'
        value: "same-origin-allow-popups"
      - key: 'Strict-Transport-Security'
        value: "max-age=31536000; includeSubDomains"
  - pattern: 'sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
